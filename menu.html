<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cardápio Digital - Peça já pelo WhatsApp">
    <title>Cardápio Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #D32F2F;
            --bg-light: #FAFAFA;
            --text-primary: #1A1A1A;
            --text-secondary: #666666;
            --border: #E0E0E0;
        }
        
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
        }
        
        .app-wrapper {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
        }
        
        /* HEADER */
        .app-header {
            background: linear-gradient(135deg, var(--primary) 0%, #B71C1C 100%);
            color: white;
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .restaurant-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .restaurant-logo {
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .restaurant-details h1 {
            font-size: 18px;
            margin-bottom: 2px;
        }
        
        .restaurant-details p {
            font-size: 12px;
            opacity: 0.9;
        }
        
        .icon-button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s;
        }
        
        .icon-button:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .search-bar {
            display: flex;
            gap: 8px;
        }
        
        .search-bar input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            background: rgba(255,255,255,0.15);
            color: white;
            font-size: 14px;
        }
        
        .search-bar input::placeholder {
            color: rgba(255,255,255,0.6);
        }
        
        .search-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        
        /* CATEGORIAS */
        .categories {
            display: flex;
            gap: 12px;
            padding: 16px 20px;
            overflow-x: auto;
            background: white;
            border-bottom: 1px solid var(--border);
            -webkit-overflow-scrolling: touch;
        }
        
        .category-btn {
            padding: 10px 18px;
            border: 1px solid var(--border);
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s;
        }
        
        .category-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        .category-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        
        /* CONTEÚDO */
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 100px;
        }
        
        .section {
            margin-bottom: 32px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        
        .dishes-grid {
            display: grid;
            gap: 16px;
        }
        
        .dish-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            gap: 12px;
        }
        
        .dish-card:active {
            transform: scale(0.98);
        }
        
        .dish-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        
        .dish-image {
            width: 100px;
            height: 100px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            position: relative;
        }
        
        .dish-image.combo {
            background: linear-gradient(135deg, #FFA500 0%, #FF6B6B 100%);
        }
        
        .badge {
            position: absolute;
            top: 6px;
            left: 6px;
            background: var(--primary);
            color: white;
            padding: 3px 6px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 700;
        }
        
        .dish-info {
            flex: 1;
            padding: 12px 12px 12px 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .dish-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }
        
        .dish-name {
            font-weight: 700;
            font-size: 15px;
            color: var(--text-primary);
        }
        
        .dish-price {
            font-weight: 700;
            color: var(--primary);
            font-size: 15px;
        }
        
        .dish-desc {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.3;
            margin: 4px 0;
        }
        
        .dish-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .rating {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .add-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
        }
        
        .add-btn:hover {
            background: #B71C1C;
        }
        
        /* CART FOOTER */
        .cart-footer {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            background: white;
            border-top: 1px solid var(--border);
            padding: 12px 20px;
            display: none;
            gap: 12px;
            align-items: center;
            z-index: 100;
        }
        
        .cart-footer.active {
            display: flex;
        }
        
        .cart-info {
            flex: 1;
        }
        
        .cart-count {
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .cart-total {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
        }
        
        .checkout-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .checkout-btn:hover {
            background: #B71C1C;
        }
        
        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 1000;
            align-items: flex-end;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            width: 100%;
            border-radius: 16px 16px 0 0;
            padding: 24px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }
        
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .modal-title {
            font-size: 22px;
            font-weight: 700;
        }
        
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-secondary);
        }
        
        .quantity-selector {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            background: var(--bg-light);
            padding: 12px 16px;
            border-radius: 8px;
            width: fit-content;
        }
        
        .qty-btn {
            background: white;
            border: 1px solid var(--border);
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
        }
        
        .qty-display {
            font-weight: 700;
            font-size: 16px;
            min-width: 30px;
            text-align: center;
        }
        
        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        
        .btn-cancel {
            flex: 1;
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .btn-add {
            flex: 1;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        
        .empty-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

<div class="app-wrapper">
    
    <!-- HEADER -->
    <div class="app-header">
        <div class="header-top">
            <div class="restaurant-info">
                <div class="restaurant-logo">🍽️</div>
                <div class="restaurant-details">
                    <h1>Seu Restaurante</h1>
                    <p>⭐ 4.8 (235) • 25 min</p>
                </div>
            </div>
            <button class="icon-button" onclick="alert('❤️ Adicionado aos favoritos!')">❤️</button>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Buscar prato...">
            <button class="search-btn" onclick="search()">🔍</button>
        </div>
    </div>
    
    <!-- CATEGORIAS -->
    <div class="categories">
        <button class="category-btn active" onclick="filterCategory('all')">🔥 Todos</button>
        <button class="category-btn" onclick="filterCategory('combos')">📦 Combos</button>
        <button class="category-btn" onclick="filterCategory('burgers')">🍔 Burgers</button>
        <button class="category-btn" onclick="filterCategory('pizzas')">🍕 Pizzas</button>
        <button class="category-btn" onclick="filterCategory('saladas')">🥗 Saladas</button>
        <button class="category-btn" onclick="filterCategory('bebidas')">🥤 Bebidas</button>
    </div>
    
    <!-- CONTEÚDO -->
    <div class="app-content">
        <div id="dishesContainer">
            <div class="empty-state">
                <div class="empty-icon">🍽️</div>
                <div style="font-size: 16px; font-weight: 600;">Carregando cardápio...</div>
            </div>
        </div>
    </div>
    
    <!-- CART FOOTER -->
    <div class="cart-footer" id="cartFooter">
        <div class="cart-info">
            <div class="cart-count" id="cartCount">1 item</div>
            <div class="cart-total" id="cartTotal">R$ 35,00</div>
        </div>
        <button class="checkout-btn" onclick="checkout()">Finalizar Pedido</button>
    </div>
</div>

<!-- MODAL DE DETALHE -->
<div class="modal" id="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title" id="modalTitle">Burger Gourmet</h2>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        
        <div style="background: var(--bg-light); padding: 16px; border-radius: 8px; margin-bottom: 20px;">
            <div style="color: var(--text-secondary); font-size: 12px; margin-bottom: 4px;">Preço</div>
            <div style="font-size: 24px; font-weight: 700; color: var(--primary);" id="modalPrice">R$ 35,00</div>
        </div>
        
        <div style="margin-bottom: 20px;">
            <div style="font-size: 13px; font-weight: 600; margin-bottom: 8px;">Instruções Especiais</div>
            <textarea id="modalNotes" placeholder="Ex: Sem cebola, bem passado..." style="padding: 12px; border: 1px solid var(--border); border-radius: 6px; width: 100%; font-size: 13px; font-family: Inter; resize: none;" rows="3"></textarea>
        </div>
        
        <div style="margin-bottom: 20px;">
            <div style="font-size: 13px; font-weight: 600; margin-bottom: 8px;">Quantidade</div>
            <div class="quantity-selector">
                <button class="qty-btn" onclick="updateQty(-1)">−</button>
                <div class="qty-display" id="modalQty">1</div>
                <button class="qty-btn" onclick="updateQty(1)">+</button>
            </div>
        </div>
        
        <div style="display: flex; gap: 12px;">
            <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
            <button class="btn-add" onclick="addToCart()">Adicionar</button>
        </div>
    </div>
</div>

<script>
let products = JSON.parse(localStorage.getItem('products')) || [];
let cart = [];
let currentQty = 1;
let currentItem = null;
let currentCategory = 'all';
let currentSearch = '';

// Inicializar
init();

function init() {
    renderDishes();
    updateCartFooter();
    
    // Monitorar mudanças em produtos (sincronização em tempo real)
    setInterval(() => {
        const newProducts = JSON.parse(localStorage.getItem('products')) || [];
        if (JSON.stringify(newProducts) !== JSON.stringify(products)) {
            products = newProducts;
            renderDishes();
        }
    }, 1000);
}

// RENDERIZAR PRATOS
function renderDishes() {
    const container = document.getElementById('dishesContainer');
    
    // Filtrar apenas produtos publicados
    let items = products.filter(p => p.status === 'published');
    
    // Filtrar por categoria
    if (currentCategory !== 'all') {
        items = items.filter(i => i.category === currentCategory);
    }
    
    // Filtrar por busca
    if (currentSearch) {
        items = items.filter(i => 
            i.name.toLowerCase().includes(currentSearch.toLowerCase())
        );
    }
    
    if (items.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">🔍</div>
                <div style="font-size: 16px; font-weight: 600;">Nenhum produto encontrado</div>
            </div>
        `;
        return;
    }
    
    // Agrupar por seção
    const sections = {};
    items.forEach(item => {
        const section = item.highlight ? '⭐ Destaque' : item.category;
        if (!sections[section]) sections[section] = [];
        sections[section].push(item);
    });
    
    let html = '';
    Object.entries(sections).forEach(([section, items]) => {
        html += `<div class="section"><h2 class="section-title">${section}</h2><div class="dishes-grid">`;
        html += items.map(item => `
            <div class="dish-card" onclick="openModal(${item.id})">
                <div class="dish-image">
                    ${item.emoji}
                    ${item.highlight ? '<div class="badge">⭐ Top</div>' : ''}
                </div>
                <div class="dish-info">
                    <div class="dish-header">
                        <div class="dish-name">${item.name}</div>
                        <div class="dish-price">R$ ${item.price.toFixed(2)}</div>
                    </div>
                    <div class="dish-desc">${item.description.substring(0, 45)}...</div>
                    <div class="dish-footer">
                        <span class="rating">⏱️ ${item.time} min</span>
                        <button class="add-btn" onclick="event.stopPropagation(); quickAdd(${item.id})">+</button>
                    </div>
                </div>
            </div>
        `).join('');
        html += '</div></div>';
    });
    
    container.innerHTML = html;
}

// FILTRAR CATEGORIA
function filterCategory(category) {
    currentCategory = category;
    document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    renderDishes();
}

// BUSCAR
function search() {
    currentSearch = document.getElementById('searchInput').value;
    renderDishes();
}

// QUICK ADD
function quickAdd(id) {
    const item = products.find(p => p.id === id);
    cart.push({
        ...item,
        quantity: 1,
        cartId: Date.now()
    });
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartFooter();
}

// ABRIR MODAL
function openModal(id) {
    currentQty = 1;
    const item = products.find(p => p.id === id);
    currentItem = item;
    
    document.getElementById('modalTitle').textContent = item.name;
    document.getElementById('modalPrice').textContent = `R$ ${item.price.toFixed(2)}`;
    document.getElementById('modalQty').textContent = '1';
    document.getElementById('modalNotes').value = '';
    
    document.getElementById('modal').classList.add('active');
}

// FECHAR MODAL
function closeModal() {
    document.getElementById('modal').classList.remove('active');
}

// UPDATE QTY
function updateQty(change) {
    currentQty = Math.max(1, currentQty + change);
    document.getElementById('modalQty').textContent = currentQty;
}

// ADICIONAR AO CARRINHO
function addToCart() {
    for (let i = 0; i < currentQty; i++) {
        cart.push({
            ...currentItem,
            quantity: 1,
            notes: document.getElementById('modalNotes').value,
            cartId: Date.now() + i
        });
    }
    
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartFooter();
    closeModal();
}

// UPDATE CART FOOTER
function updateCartFooter() {
    const footer = document.getElementById('cartFooter');
    
    if (cart.length === 0) {
        footer.classList.remove('active');
        return;
    }
    
    footer.classList.add('active');
    
    const total = cart.reduce((sum, item) => sum + item.price, 0);
    
    document.getElementById('cartCount').textContent = `${cart.length} item${cart.length > 1 ? 's' : ''}`;
    document.getElementById('cartTotal').textContent = `R$ ${total.toFixed(2)}`;
}

// CHECKOUT
function checkout() {
    if (cart.length === 0) return;
    
    const total = cart.reduce((sum, item) => sum + item.price, 0);
    const items = cart.map(i => `${i.quantity || 1}x ${i.name}`).join(', ');
    
    alert(`✅ Pedido enviado!\n\n${items}\n\nTotal: R$ ${total.toFixed(2)}\n\n📲 Você receberá uma mensagem no WhatsApp com a confirmação.`);
    
    cart = [];
    localStorage.setItem('cart', JSON.stringify(cart));
    updateCartFooter();
}
</script>

</body>
</html>
